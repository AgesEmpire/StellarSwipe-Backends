name: OpenAPI Spec Drift Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  openapi-drift:
    name: Detect OpenAPI specification drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stellarswipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Step 1: Generate the OpenAPI spec deterministically ───────────────
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Export OpenAPI spec
        run: npm run export:openapi
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-jwt-secret-for-spec-export
          STELLAR_NETWORK: testnet
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org:443

      - name: Upload generated OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/generated/openapi.json
          retention-days: 7

      # ── Step 2: Compare generated spec against the committed spec ─────────
      - name: Check for OpenAPI specification drift
        run: |
          COMMITTED="docs/openapi.json"
          GENERATED="docs/generated/openapi.json"

          # If the committed spec doesn't exist yet, this is itself a drift —
          # the spec should be committed after initial generation.
          if [ ! -f "${COMMITTED}" ]; then
            echo "❌  ${COMMITTED} does not exist."
            echo ""
            echo "Generate it locally and commit:"
            echo "    npm run export:openapi"
            echo "    git add ${COMMITTED}"
            echo "    git commit -m 'chore(openapi): add committed specification'"
            exit 1
          fi

          # Normalise both specs so ordering and formatting differences do not
          # produce false positives. jq -S sorts object keys recursively.
          jq -S . "${COMMITTED}" > /tmp/committed_openapi.json
          jq -S . "${GENERATED}"  > /tmp/generated_openapi.json

          if ! diff -u /tmp/committed_openapi.json /tmp/generated_openapi.json; then
            echo ""
            echo "❌  OpenAPI specification has drifted from the committed spec."
            echo "    Controller or DTO changes produced undocumented API drift."
            echo ""
            echo "If the drift is intentional, update the committed spec locally:"
            echo "    npm run export:openapi"
            echo "    cp docs/generated/openapi.json docs/openapi.json"
            echo "    git add docs/openapi.json"
            echo "    git commit -m 'chore(openapi): update committed specification'"
            echo ""
            echo "Then push and re-run CI."
            exit 1
          fi

          echo "✅  OpenAPI specification is in sync with the committed spec."

      # ── Upload diff artifact on failure for easier debugging ──────────────
      - name: Upload drift diff on failure
        if: failure()
        run: |
          diff \
            /tmp/committed_openapi.json \
            /tmp/generated_openapi.json \
            > /tmp/openapi-drift.patch || true
        continue-on-error: true

      - name: Upload drift diff artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-drift-diff
          path: /tmp/openapi-drift.patch
          retention-days: 3
