name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stellarswipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check for unguarded destructive migrations
        run: node scripts/check-destructive-migrations.js

      - name: Run migrations (up)
        run: npm run migration:run
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test

      - name: Run seeds
        run: npm run seed
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test

      - name: Validate migration rollback (down)
        run: npm run migration:revert
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test

      - name: Re-apply migration after rollback test
        run: npm run migration:run
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test

      - name: Run unit tests
        run: npm test -- --coverage --maxWorkers=2
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  openapi-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI document
        run: npm run openapi:generate
        env:
          NODE_ENV: test

      - name: Detect OpenAPI drift
        run: |
          set -o pipefail
          if ! npm run openapi:check 2>&1 | tee openapi-drift.log; then
            echo "::error::OpenAPI specification drift detected. The committed spec (openapi.json) does not match the generated output (openapi.generated.json)."
            echo ""
            echo "### OpenAPI drift diff"
            echo '```diff'
            diff -u openapi.json openapi.generated.json || true
            echo '```'
            echo ""
            echo "If this drift is intentional, regenerate and commit the specification:"
            echo "  npm run openapi:generate && npm run openapi:check -- --update"
            echo "See README.md (OpenAPI specification drift) for the approved update workflow."
            exit 1
          fi

      - name: Upload OpenAPI drift report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-drift-report
          path: |
            openapi.json
            openapi.generated.json
            openapi-drift.log
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking on PRs; set to false on release branches

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stellarswipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
