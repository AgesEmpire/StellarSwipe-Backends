name: Benchmark

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/trades/**'
      - 'src/auth/**'
      - 'src/signals/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking by default

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stellarswipe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test

      - name: Start app in background
        run: npm run start:prod &
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: stellarswipe_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000/api/v1/health --timeout 30000

      - name: Install autocannon
        run: npm install -g autocannon

      - name: Benchmark signal feed
        run: |
          autocannon -c 10 -d 15 --json \
            http://localhost:3000/api/v1/signals \
            > benchmark-signal-feed.json
          cat benchmark-signal-feed.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-*.json
          retention-days: 30
